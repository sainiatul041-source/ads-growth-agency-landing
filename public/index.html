<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADS GROWTH AGENCY</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:linear-gradient(135deg,#071126,#111b38);
 color:white;
 font-family:Arial,sans-serif
}
header{
 padding:18px 5%;
 border-bottom:1px solid #ffffff22
}
.logo{
 font-size:23px;
 font-weight:bold;
 color:#7cf7b3
}
main{
 max-width:1000px;
 margin:24px auto;
 padding:14px
}
.card{
 background:#111d38;
 border:1px solid #ffffff22;
 border-radius:16px;
 padding:20px;
 margin:14px 0
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:12px
}
input,textarea,select{
 width:100%;
 padding:12px;
 margin:7px 0 13px;
 border-radius:8px;
 border:1px solid #52617c;
 background:#091329;
 color:white
}
button{
 padding:12px 16px;
 border:0;
 border-radius:9px;
 background:#13b86b;
 font-weight:bold;
 margin:4px;
 cursor:pointer
}
.secondary{background:#304365;color:white}
.danger{background:#e45d65;color:white}
.hidden{display:none!important}
.muted{color:#aab8d2}
.price,.stat{
 font-size:27px;
 color:#7cf7b3;
 font-weight:bold
}
.item{
 padding:12px;
 border-bottom:1px solid #ffffff22
}
label{
 display:block;
 color:#c8d4e8;
 font-size:14px
}
a{color:#8bdcff}
#photoPreview img{
 display:block;
 margin:10px auto;
 object-fit:contain;
 max-width:100%
}
</style>
</head>

<body>

<header>
 <div class="logo">ADS GROWTH AGENCY 📈</div>
</header>

<main>

<!-- LOGIN AND REGISTER -->
<section id="auth" class="grid">

 <div class="card">
  <h2>Login</h2>

  <label>Email</label>
  <input id="le" type="email" placeholder="Enter email">

  <label>Password</label>
  <input id="lp" type="password" placeholder="Enter password">

  <button onclick="login()">Login</button>
  <p id="loginMsg" class="muted"></p>
 </div>

 <div class="card">
  <h2>Create Account</h2>

  <label>Name</label>
  <input id="rn" placeholder="Your name">

  <label>Email</label>
  <input id="re" type="email" placeholder="Enter email">

  <label>Password</label>
  <input id="rp" type="password" placeholder="Minimum 6 characters">

  <button onclick="register()">Register</button>
  <p id="registerMsg" class="muted"></p>
 </div>

</section>

<!-- DASHBOARD -->
<section id="app" class="hidden">

 <div class="card">
  <button class="secondary" onclick="logout()">Logout</button>
  <span id="account"></span>
  <h1>Dashboard</h1>
  <p class="muted">Welcome to ADS GROWTH AGENCY</p>
 </div>

 <div class="card">
  <h2>Available Plans</h2>
  <div id="planCards" class="grid"></div>
  <p class="muted">
   Plan information only. Payment submission is not connected in this version.
  </p>
 </div>

 <!-- PAGE BUILDER -->
 <section id="builder" class="card">

  <h2>Landing Page Builder</h2>

  <input type="hidden" id="pid">

  <div class="grid">

   <div>
    <label>Page Title</label>
    <input id="title" placeholder="Page title">
   </div>

   <div>
    <label>Headline</label>
    <input id="headline" placeholder="Your headline">
   </div>

   <div>
    <label>Button Text</label>
    <input id="bt" value="Get Started">
   </div>

   <div>
    <label>Button URL</label>
    <input id="bu" placeholder="https://example.com">
   </div>

   <div>
    <label>Image URL</label>
    <input id="img" placeholder="https://example.com/image.jpg">
   </div>

   <div>
    <label>Photo Width (%)</label>
    <input id="imgWidth" type="number"
     min="10" max="100" value="100">
   </div>

   <div>
    <label>Photo Height (px)</label>
    <input id="imgHeight" type="number"
     min="80" max="1200" value="350">
   </div>

  </div>

  <label>Description</label>
  <textarea id="desc" placeholder="Page description"></textarea>

  <div class="muted">
   Photo Size:
   <button type="button" class="secondary"
    onclick="photoPreset(35,140)">Small</button>

   <button type="button" class="secondary"
    onclick="photoPreset(65,240)">Medium</button>

   <button type="button" class="secondary"
    onclick="photoPreset(100,350)">Large</button>
  </div>

  <div id="photoPreview"></div>

  <button onclick="save()">Save Page</button>
  <button class="secondary" onclick="clearForm()">New Page</button>

  <p id="pmsg" class="muted"></p>

  <h3>My Pages</h3>
  <div id="pages"></div>

 </section>

</section>

</main>

<script>
let token = localStorage.getItem("ag_token");
let me = null;

const $ = id => document.getElementById(id);

function visible(){
 $("auth").classList.toggle("hidden",!!token);
 $("app").classList.toggle("hidden",!token);
}

async function api(url,options={}){
 const response = await fetch("/api"+url,{
  ...options,
  headers:{
   "Content-Type":"application/json",
   ...(token?{Authorization:"Bearer "+token}:{}),
   ...(options.headers||{})
  }
 });

 const data = await response.json().catch(()=>({}));

 if(!response.ok){
  throw new Error(data.error||"Request failed");
 }

 return data;
}

// LOGIN
async function login(){
 $("loginMsg").textContent="Logging in...";

 try{
  const data=await api("/login",{
   method:"POST",
   body:JSON.stringify({
    email:$("le").value.trim(),
    password:$("lp").value
   })
  });

  if(!data.token){
   throw new Error("Login token not received");
  }

  token=data.token;
  localStorage.setItem("ag_token",token);

  await start();

 }catch(error){
  $("loginMsg").textContent=error.message;
 }
}

// REGISTER
async function register(){
 $("registerMsg").textContent="Creating account...";

 try{
  const data=await api("/register",{
   method:"POST",
   body:JSON.stringify({
    name:$("rn").value.trim(),
    email:$("re").value.trim(),
    password:$("rp").value
   })
  });

  if(!data.token){
   throw new Error("Registration token not received");
  }

  token=data.token;
  localStorage.setItem("ag_token",token);

  await start();

 }catch(error){
  $("registerMsg").textContent=error.message;
 }
}

// LOGOUT
function logout(){
 localStorage.removeItem("ag_token");
 token=null;
 me=null;
 location.reload();
}

// START DASHBOARD
async function start(){
 try{
  visible();

  // Backend /api/me returns the user object directly
  me=await api("/me");

  $("account").textContent="Logged in: "+me.email;

  // Load plans
  const plans=await api("/plans");

  $("planCards").innerHTML=plans.map(p=>`
   <div class="card">
    <h3>${esc(p.name)}</h3>
    <div class="price">₹${Number(p.amount)}</div>
   </div>
  `).join("");

  await pages();

  visible();

 }catch(error){
  console.error("Dashboard error:",error);

  localStorage.removeItem("ag_token");
  token=null;
  me=null;

  visible();

  $("loginMsg").textContent=
   "Session error: "+error.message;
 }
}

// HTML ESCAPE
function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

// PHOTO PRESETS
function photoPreset(width,height){
 $("imgWidth").value=width;
 $("imgHeight").value=height;
 photoPreview();
}

// PHOTO PREVIEW
function photoPreview(){
 const url=$("img").value.trim();

 const width=Math.max(
  10,Math.min(100,Number($("imgWidth").value)||100)
 );

 const height=Math.max(
  80,Math.min(1200,Number($("imgHeight").value)||350)
 );

 $("photoPreview").innerHTML=url?`
  <p>Photo Preview</p>
  <img src="${esc(url)}"
   style="width:${width}%;height:${height}px"
   onerror="this.alt='Image could not load'">
 `:"";
}

["img","imgWidth","imgHeight"].forEach(id=>{
 $(id).addEventListener("input",photoPreview);
});

// CLEAR FORM
function clearForm(){
 [
  "pid","title","headline","desc","bu","img"
 ].forEach(id=>$(id).value="");

 $("bt").value="Get Started";
 $("imgWidth").value=100;
 $("imgHeight").value=350;

 $("pmsg").textContent="";
 photoPreview();
}

// SAVE PAGE
async function save(){
 try{
  const body={
   title:$("title").value,
   heading:$("headline").value,
   description:$("desc").value,
   buttonText:$("bt").value,
   buttonUrl:$("bu").value,
   imageUrl:$("img").value,
   imageWidth:Number($("imgWidth").value),
   imageHeight:Number($("imgHeight").value)
  };

  const id=$("pid").value;

  const data=await api("/pages"+(id?"/"+id:""),{
   method:id?"PUT":"POST",
   body:JSON.stringify(body)
  });

  $("pid").value=data.page.id;
  $("pmsg").textContent="Page saved successfully!";

  await pages();

 }catch(error){
  $("pmsg").textContent=error.message;
 }
}

// LOAD PAGES
async function pages(){
 try{
  // Backend returns an array directly
  const list=await api("/pages");

  $("pages").innerHTML=list.map(p=>`
   <div class="item">
    <b>${esc(p.title)}</b>
    — ${p.published?"Published":"Draft"}

    <br>

    ${p.published?
     `<a href="/p/${encodeURIComponent(p.slug)}"
       target="_blank">Open Page</a>`:""
    }

    <br>

    <button class="secondary"
     onclick="editPage(${Number(p.id)})">
     Edit
    </button>

    ${!p.published?
     `<button onclick="publishPage(${Number(p.id)})">
       Publish
      </button>`:""
    }

    <button class="danger"
     onclick="deletePage(${Number(p.id)})">
     Delete
    </button>
   </div>
  `).join("")||"<p>No pages created yet.</p>";

 }catch(error){
  $("pages").textContent=error.message;
 }
}

// EDIT PAGE
async function editPage(id){
 try{
  const list=await api("/pages");
  const page=list.find(p=>Number(p.id)===Number(id));

  if(!page){
   throw new Error("Page not found");
  }

  $("pid").value=page.id;
  $("title").value=page.title||"";
  $("headline").value=page.heading||"";
  $("desc").value=page.description||"";
  $("bt").value=page.button_text||"Get Started";
  $("bu").value=page.button_url||"";
  $("img").value=page.image_url||"";
  $("imgWidth").value=page.image_width_percent??100;
  $("imgHeight").value=page.image_height_px??350;

  photoPreview();

  $("builder").scrollIntoView({
   behavior:"smooth"
  });

 }catch(error){
  alert(error.message);
 }
}

// PUBLISH PAGE
async function publishPage(id){
 try{
  const data=await api("/pages/"+id+"/publish",{
   method:"POST"
  });

  await pages();

  alert("Page published!\n"+data.url);

 }catch(error){
  alert(error.message);
 }
}

// DELETE PAGE
async function deletePage(id){
 if(!confirm("Are you sure you want to delete this page?")){
  return;
 }

 try{
  await api("/pages/"+id,{
   method:"DELETE"
  });

  await pages();

 }catch(error){
  alert(error.message);
 }
}

// INITIAL CHECK
visible();

if(token){
 start();
}
</script>

</body>
  </html>
